services:
  - type: web
    name: video-and-audio-text-subtitle-extract
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn converter_project.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
